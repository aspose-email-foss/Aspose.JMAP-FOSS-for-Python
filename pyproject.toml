[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspose-jmap-foss"
version = "0.1.0"
description = "Open-source JMAP (RFC 8620 Core / RFC 8621 Mail + EmailSubmission) client library with an Aspose.Email-style API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aspose", email = "jmap@aspose.com" }]
keywords = ["jmap", "rfc8620", "rfc8621", "email", "mail", "client"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/aspose-email-foss/Aspose.JMAP-FOSS-for-Python"
Repository = "https://github.com/aspose-email-foss/Aspose.JMAP-FOSS-for-Python"
Issues = "https://github.com/aspose-email-foss/Aspose.JMAP-FOSS-for-Python/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
